<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faro — Nuevo movimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Ícono / PWA -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faro">
<meta name="theme-color" content="#0B0D12">

<style>
  .form-shell {
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    min-height: calc(100vh - 24px);
  }

  .form-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0 8px;
  }

  .form-topbar-action {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-secondary);
    padding: 8px 0;
  }

  .form-topbar-action.save {
    color: var(--blue);
    font-weight: 600;
  }

  .form-topbar-label {
    color: var(--text-tertiary);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.4px;
  }

  .type-tabs {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin: 16px 0 20px;
  }

  .type-tab {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-tertiary);
    padding-bottom: 6px;
  }

  .type-tab.active.expense {
    color: var(--red);
    border-bottom-color: var(--red);
  }

  .type-tab.active.income {
    color: var(--green);
    border-bottom-color: var(--green);
  }

  .amount-display {
    width: 100%;
    background: none;
    border: none;
    outline: none;
    text-align: center;
    font-family: inherit;
    font-size: 48px;
    font-weight: 600;
    letter-spacing: -1px;
    margin-bottom: 28px;
    caret-color: var(--blue);
  }

  .amount-display.expense { color: var(--red); }
  .amount-display.income { color: var(--green); }

  .chip-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 24px;
  }

  .chip {
    padding: 10px 16px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    font-family: inherit;
    font-size: 14px;
    color: var(--text-secondary);
  }

  .chip.selected {
    background: var(--hover);
    color: var(--text-primary);
  }

  .field-row {
    background: var(--card);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }

  .field-row input[type="text"] {
    width: 100%;
    background: none;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-primary);
  }

  .field-row input[type="text"]::placeholder {
    color: var(--text-tertiary);
  }

  .field-row.date {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .field-row.date .field-label {
    color: var(--text-secondary);
    font-size: 15px;
  }

  .field-row.date .field-value {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-primary);
    font-size: 15px;
  }

  .field-row.date input[type="date"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    width: 100%;
    height: 100%;
    border: none;
  }

  .spacer {
    flex: 1;
  }

  .save-button {
    width: 100%;
    height: 56px;
    border-radius: 16px;
    border: none;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--bg);
    margin-top: 16px;
    margin-bottom: 24px;
  }

  .save-button.expense { background: var(--red); }
  .save-button.income { background: var(--green); }

  .save-button:disabled {
    opacity: 0.5;
  }

  .form-error {
    color: var(--red);
    font-size: 13px;
    text-align: center;
    min-height: 18px;
    margin-bottom: 4px;
  }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="form-shell">
      <div class="form-topbar">
        <button class="form-topbar-action" id="cancel-btn">Cancelar</button>
        <div class="form-topbar-label" id="topbar-label">NUEVO MOVIMIENTO</div>
        <button class="form-topbar-action save" id="save-top-btn">Guardar</button>
      </div>

      <div class="type-tabs">
        <button class="type-tab expense" data-type="expense">Gasto</button>
        <button class="type-tab income" data-type="income">Ingreso</button>
      </div>

      <input class="amount-display" id="amount-input" inputmode="numeric" autocomplete="off" value="$0">

      <div class="chip-row" id="chip-row"></div>

      <div class="field-row">
        <input type="text" id="description-input" placeholder="Descripción">
      </div>

      <div class="field-row date" id="date-row">
        <span class="field-label">Fecha</span>
        <span class="field-value">
          <span id="date-display">Hoy</span>
          <svg width="8" height="14" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6" stroke="#5E6775" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input type="date" id="date-input">
      </div>

      <div class="form-error" id="form-error"></div>

      <div class="spacer"></div>

      <button class="save-button expense" id="save-btn">Guardar $0</button>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script src="utils.js"></script>
<script src="nav.js"></script>
<script src="agregar-movimiento.js"></script>
</body>
</html>
