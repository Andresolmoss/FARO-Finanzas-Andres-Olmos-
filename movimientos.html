<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faro — Movimientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Ícono / PWA -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="shortcut icon" href="/img/favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faro">
<meta name="theme-color" content="#0B0D12">
<style>
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .page-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .filter-tabs {
    display: flex;
    gap: 20px;
    margin-bottom: 8px;
  }

  .filter-tab {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 15px;
    color: var(--text-tertiary);
    padding-bottom: 8px;
    border-bottom: 2px solid transparent;
  }

  .filter-tab.active {
    color: var(--text-primary);
    font-weight: 500;
    border-bottom-color: var(--blue);
  }

  .group-date {
    color: var(--text-tertiary);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin: 24px 0 4px;
  }

  .movement-row {
    position: relative;
    cursor: pointer;
  }

  .movement-row:active {
    background: var(--hover);
  }

  .content-max {
    max-width: 960px;
  }

  /* Panel de edición / borrado (sheet inferior simple) */
  .edit-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
  }

  .edit-overlay.open {
    display: flex;
  }

  .edit-panel {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 32px;
  }

  .edit-panel-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .edit-panel-amount {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 24px;
  }

  .edit-action {
    width: 100%;
    height: 52px;
    border-radius: 14px;
    background: var(--hover);
    border: none;
    color: var(--text-primary);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    margin-bottom: 12px;
  }

  .edit-action.delete {
    color: var(--red);
  }

  .edit-action.cancel {
    background: none;
    color: var(--text-secondary);
    margin-bottom: 0;
  }

  .empty-state {
    padding: 48px 0;
    text-align: center;
  }

  @media (min-width: 900px) {
    .page-title {
      font-size: 28px;
    }
  }
</style>
</head>
<body>

<div class="app-shell">

  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="content-max" style="margin: 0 auto">
      <div class="page-header">
        <div>
          <div class="page-title">Movimientos</div>
          <div style="color: var(--text-tertiary); font-size: 14px; margin-top: 4px;">Todos tus ingresos y gastos.</div>
        </div>
      </div>

      <div class="movements-summary">
        <div class="summary-main">
          <div class="summary-label">Gastado este mes</div>
          <div class="summary-amount tabular" id="summary-amount">$0</div>
          <div class="summary-delta" id="summary-delta" style="display:none"></div>
        </div>
        <div class="summary-chart">
          <svg viewBox="0 0 320 80" preserveAspectRatio="none">
            <path id="summary-chart-line" fill="none" stroke="#F87171" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="summary-count-card">
          <div class="summary-count-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.5H21"/><circle cx="16.5" cy="14.5" r="1.3" fill="currentColor" stroke="none"/></svg>
          </div>
          <div>
            <div class="summary-count-value" id="summary-count-value">0 movimientos</div>
            <div class="summary-count-hint" id="summary-count-hint"></div>
          </div>
        </div>
      </div>

      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">Todos</button>
        <button class="filter-tab" data-filter="income">Ingresos</button>
        <button class="filter-tab" data-filter="expense">Gastos</button>
      </div>

      <div id="movements-container"></div>

      <div class="empty-state" id="empty-state" style="display:none">
        <div style="color: var(--text-primary); font-size: 15px; font-weight: 500;">No hay movimientos para mostrar.</div>
        <div style="color: var(--text-tertiary); font-size: 13px; margin-top: 6px;">Usá el botón + para agregar uno.</div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
  <button class="fab" id="fab" aria-label="Agregar movimiento"></button>

</div>

<!-- Panel de editar / borrar -->
<div class="edit-overlay" id="edit-overlay">
  <div class="edit-panel">
    <div class="edit-panel-title" id="edit-panel-title"></div>
    <div class="edit-panel-amount" id="edit-panel-amount"></div>
    <button class="edit-action" id="edit-btn">Editar</button>
    <button class="edit-action delete" id="delete-btn">Eliminar</button>
    <button class="edit-action cancel" id="cancel-edit-btn">Cancelar</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script src="utils.js"></script>
<script src="nav.js"></script>
<script src="movimientos.js"></script>
</body>
</html>
