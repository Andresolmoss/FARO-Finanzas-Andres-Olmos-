<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faro — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<!-- Ícono / PWA -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="shortcut icon" href="/img/favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faro">
<meta name="theme-color" content="#0B0D12">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="greeting" id="greeting"></div>
    <div class="dashboard-grid">
      <div class="dashboard-col-left">
        <div class="balance-label">Disponible hoy</div>
        <div class="balance-amount tabular" id="balance-amount">$0</div>
        <div class="stat-row">
          <div class="stat-card">
            <div class="label">Ingresos</div>
            <div class="value income tabular" id="stat-income">$0</div>
          </div>
          <div class="stat-card">
            <div class="label">Gastos</div>
            <div class="value expense tabular" id="stat-expense">$0</div>
          </div>
          <div class="stat-card">
            <div class="label">Ahorro</div>
            <div class="value savings tabular" id="stat-savings">$0</div>
          </div>
        </div>
        <div class="chart-card">
          <svg viewBox="0 0 640 160" preserveAspectRatio="none" id="chart-svg">
            <defs>
              <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.25"/>
                <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <path id="chart-area" fill="url(#chartGrad)"/>
            <path id="chart-line" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
          </svg>
          <div class="chart-labels">
            <span id="chart-label-start"></span>
            <span id="chart-label-end"></span>
          </div>
        </div>
      </div>
      <div class="dashboard-col-right">
        <div>
          <div class="section-header">
            <div class="section-title">Últimos movimientos</div>
            <a href="movimientos.html" class="section-link">Ver todos</a>
          </div>
          <div class="movement-list" id="movement-list"></div>
          <div class="empty-state" id="movement-empty" style="display:none">
            <div class="empty-state-text">Todavía no cargaste ningún movimiento.</div>
            <div class="empty-state-hint">Usá el botón + para agregar el primero.</div>
          </div>
        </div>
        <div class="insight-card">
          <div class="insight-dot"></div>
          <div class="insight-text" id="insight-text"></div>
        </div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav" id="bottom-nav"></nav>
  <button class="fab" id="fab" aria-label="Agregar movimiento"></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script src="utils.js"></script>
<script src="nav.js"></script>
<script src="dashboard.js"></script>
</body>
</html>
