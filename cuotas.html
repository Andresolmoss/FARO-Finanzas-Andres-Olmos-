<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faro — Cuotas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Ícono / PWA -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/img/favicon-16x16.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="shortcut icon" href="/img/favicon.ico">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Faro">
<meta name="theme-color" content="#0B0D12">

<style>
  .content-max { max-width: 720px; }

  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 12px;
  }

  .page-title {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.5px;
  }

  .load-btn {
    background: var(--card);
    border: none;
    color: var(--text-primary);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .load-btn:hover { background: var(--hover); }

  .chip-row {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .chip {
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    font-weight: 500;
  }

  .chip.active {
    background: rgba(96, 165, 250, 0.15);
    color: var(--blue);
    border-color: rgba(96, 165, 250, 0.3);
  }

  .cuota-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    background: var(--card);
    border-radius: var(--radius-md);
    padding: 16px;
    margin-bottom: 10px;
  }

  .cuota-card-left { min-width: 0; }
  .cuota-card-name { font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .cuota-card-meta { font-size: 13px; color: var(--text-tertiary); margin-top: 3px; }
  .cuota-card-right { text-align: right; flex-shrink: 0; }
  .cuota-card-amount { font-size: 16px; font-weight: 600; color: var(--text-primary); }
  .cuota-card-end { font-size: 12px; color: var(--text-tertiary); margin-top: 3px; }

  .history-link {
    display: block;
    text-align: center;
    font-size: 13px;
    color: var(--text-tertiary);
    margin-top: 20px;
  }

  /* Modal de carga */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal-box {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 28px;
    max-width: 560px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .modal-title { font-size: 17px; font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--text-tertiary); font-size: 20px; }

  .step { display: none; }
  .step.active { display: block; }

  .prompt-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    font-size: 12px;
    color: var(--text-secondary);
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
    margin-bottom: 16px;
    font-family: ui-monospace, monospace;
  }

  .paste-textarea {
    width: 100%;
    min-height: 160px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text-primary);
    font-size: 13px;
    font-family: ui-monospace, monospace;
    padding: 12px;
    margin-bottom: 16px;
    resize: vertical;
  }

  .primary-btn {
    width: 100%;
    height: 48px;
    border-radius: var(--radius-sm);
    background: var(--blue);
    color: var(--bg);
    border: none;
    font-size: 15px;
    font-weight: 600;
  }

  .secondary-btn {
    width: 100%;
    height: 44px;
    border-radius: var(--radius-sm);
    background: var(--hover);
    color: var(--text-primary);
    border: none;
    font-size: 14px;
    font-weight: 500;
    margin-top: 10px;
  }

  .review-section-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text-tertiary);
    margin: 20px 0 10px;
  }

  .review-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-bottom: 10px;
  }

  .review-item-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .review-item-desc { flex: 1; font-size: 14px; font-weight: 500; }
  .review-item-amount { font-size: 14px; font-weight: 600; }
  .review-item-meta { font-size: 12px; color: var(--text-tertiary); margin: 4px 0 10px 26px; }

  .review-item-selects {
    display: flex;
    gap: 8px;
    margin-left: 26px;
  }
  .review-item-selects select {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 13px;
    padding: 8px;
  }

  .warning-box {
    background: rgba(251, 191, 36, 0.1);
    border: 1px solid rgba(251, 191, 36, 0.25);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--yellow);
    margin-bottom: 10px;
  }

  .error-box {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.25);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 12px;
  }
</style>
</head>
<body>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>

  <main class="main">
    <div class="content-max" style="margin: 0 auto">
      <div class="page-header">
        <div class="page-title">Cuotas</div>
        <button class="load-btn" id="open-load-btn">Cargar resumen</button>
      </div>

      <div class="stat-row" id="stat-row"></div>

      <div class="chip-row" id="chip-row"></div>

      <div id="cuotas-list"></div>

      <a href="#" class="history-link" id="history-link">Ver historial de cuotas finalizadas</a>
      <div id="history-list" style="display:none; margin-top:12px"></div>
    </div>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<div class="modal-overlay" id="load-modal">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title">Cargar resumen con IA</div>
      <button class="modal-close" id="close-modal-btn" aria-label="Cerrar">×</button>
    </div>

    <div class="step active" id="step-prompt">
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 12px">
        Copiá este prompt y pegalo junto con tu resumen (imagen, PDF o texto) en Claude, ChatGPT o Gemini.
      </p>
      <div class="prompt-box" id="prompt-text"></div>
      <button class="primary-btn" id="copy-prompt-btn">Copiar prompt</button>
      <button class="secondary-btn" id="go-paste-btn">Ya tengo la respuesta de la IA</button>
    </div>

    <div class="step" id="step-paste">
      <p style="font-size:13px; color:var(--text-secondary); margin:0 0 12px">
        Pegá acá el JSON que te devolvió la IA.
      </p>
      <div class="error-box" id="paste-error" style="display:none"></div>
      <textarea class="paste-textarea" id="paste-textarea" placeholder="{ ... }"></textarea>
      <button class="primary-btn" id="process-json-btn">Procesar</button>
      <button class="secondary-btn" id="back-to-prompt-btn">Volver</button>
    </div>

    <div class="step" id="step-review">
      <div id="review-content"></div>
      <button class="primary-btn" id="save-review-btn">Guardar cuotas seleccionadas</button>
      <button class="secondary-btn" id="close-review-btn">Cancelar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabaseClient.js"></script>
<script src="utils.js"></script>
<script src="nav.js"></script>
<script src="cuotas-engine.js"></script>
<script src="cuotas.js"></script>
</body>
</html>
